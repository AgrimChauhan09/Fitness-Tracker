spring.application.name=fitness
server.port=8081

# Replace the URL below with your own Neon database connection URL
spring.datasource.url=jxxxxxxxxxxxxxx

# Replace with your Neon database username (from the Neon dashboard)
spring.datasource.username=xxxxxxxxx

# Replace with your Neon database password (from the Neon dashboard)
spring.datasource.password=xxxxxxxxxx

spring.jpa.hibernate.ddl-auto=update

# PostgreSQL Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# ---- Spring Security (MOST IMPORTANT) ----
logging.level.org.springframework.security=DEBUG

# ---- Web / MVC ----
logging.level.org.springframework.web=DEBUG

# ---- Dispatcher & filters ----
logging.level.org.springframework.web.filter=DEBUG